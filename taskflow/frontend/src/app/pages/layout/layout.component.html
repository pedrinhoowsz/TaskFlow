<div class="shell" [class.menu-aberto]="menuAberto()">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="14" rx="2" fill="#fff"/><rect x="9" y="1" width="6" height="9" rx="2" fill="#fff" opacity=".7"/></svg>
      </span>
      TaskFlow
    </div>

    <nav (click)="menuAberto.set(false)">
      <a routerLink="/quadro" routerLinkActive="ativo">
        <svg viewBox="0 0 20 20"><rect x="2" y="3" width="5" height="14" rx="1.5"/><rect x="8.5" y="3" width="5" height="9" rx="1.5"/><rect x="15" y="3" width="3" height="6" rx="1.5"/></svg>
        Quadro
      </a>
      <a routerLink="/dashboard" routerLinkActive="ativo">
        <svg viewBox="0 0 20 20"><rect x="2" y="11" width="4" height="7" rx="1"/><rect x="8" y="6" width="4" height="12" rx="1"/><rect x="14" y="2" width="4" height="16" rx="1"/></svg>
        Dashboard
      </a>
      <a routerLink="/projetos" routerLinkActive="ativo">
        <svg viewBox="0 0 20 20"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l2 2h7A1.5 1.5 0 0 1 18 7.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 2 15.5z"/></svg>
        Projetos
      </a>
    </nav>

    <div class="perfil">
      <span class="avatar">{{ iniciais() }}</span>
      <div class="perfil-txt">
        <strong>{{ auth.usuario()?.nome }}</strong>
        <small>{{ auth.usuario()?.email }}</small>
      </div>
      <button class="btn-icon" title="Sair" (click)="auth.sair()">⎋</button>
    </div>
  </aside>

  <div class="fundo" (click)="menuAberto.set(false)"></div>

  <main class="conteudo">
    <button class="btn-icon menu-btn" (click)="menuAberto.set(true)" aria-label="Abrir menu">☰</button>
    <router-outlet />
  </main>
</div>
