spring.application.name=taskflow-api
server.port=8080

# ===== MySQL =====
# NÃO coloque sua senha real aqui (este arquivo vai para o GitHub).
# Coloque-a no arquivo backend/local.properties (veja local.properties.example).
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA / Hibernate =====
# "update" cria e atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== JWT =====
# Chave secreta (mínimo 32 caracteres). NÃO coloque a chave aqui:
# defina em backend/local.properties ou na variável de ambiente TASKFLOW_JWT_SECRET.
taskflow.jwt.secret=${TASKFLOW_JWT_SECRET:}
# Validade do token em horas
taskflow.jwt.expiracao-horas=8

# Endereço do frontend Angular (liberado no CORS)
taskflow.cors.origem=http://localhost:4200

# Carrega configurações locais (ex.: senha real do MySQL), se o arquivo existir.
# O arquivo local.properties está no .gitignore e não vai para o GitHub.
spring.config.import=optional:file:./local.properties
