name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskflow/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: taskflow/backend/pom.xml

      - name: Rodar testes
        run: mvn -B test

  frontend:
    name: Frontend (testes unitários e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskflow/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: taskflow/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários
        run: npm run test:ci

      - name: Build de produção
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: taskflow/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: taskflow/backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: taskflow/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Baixa as dependências do Maven e compila antes, para a API subir rápido no Playwright
      - name: Compilar backend
        run: mvn -B -q -f ../backend/pom.xml test-compile

      # O runner do GitHub já vem com o Google Chrome (playwright.config.ts usa channel: 'chrome')
      - name: Rodar testes E2E
        run: npm run e2e

      - name: Enviar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: taskflow/frontend/playwright-report/
          retention-days: 14
